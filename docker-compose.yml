services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: recipe_user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ──────────────────────────────────────────────────

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/recipe_user_db
    depends_on:
      mysql:
        condition: service_healthy

  recipe-service:
    build: ./recipe-service
    ports:
      - "8082:8082"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  recipe-embedding-service:
    build: ./recipe-embedding-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  user-mcp-server:
    build: ./user-mcp-server
    ports:
      - "8086:8086"
    environment:
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      - user-service

  recipe-mcp-server:
    build: ./recipe-mcp-server
    ports:
      - "8085:8085"
    environment:
      RECIPE_EMBEDDING_SERVICE_URL: http://recipe-embedding-service:8083
    depends_on:
      - recipe-embedding-service

  discovery-agent-service:
    build: ./discovery-agent-service
    ports:
      - "8084:8084"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RECIPE_MCP_URL: http://recipe-mcp-server:8085/mcp
      USER_MCP_URL: http://user-mcp-server:8086/mcp
    depends_on:
      - recipe-mcp-server
      - user-mcp-server

  consumer-api:
    build: ./consumer-api
    ports:
      - "8088:8088"
    environment:
      RECIPE_SERVICE_URL: http://recipe-service:8082
      USER_SERVICE_URL: http://user-service:8081
      AGENT_SERVICE_URL: http://discovery-agent-service:8084
    depends_on:
      - recipe-service
      - user-service
      - discovery-agent-service

volumes:
  mongodb_data:
  mysql_data:
  qdrant_data:
